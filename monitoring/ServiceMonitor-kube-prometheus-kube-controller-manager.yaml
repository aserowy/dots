apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: kube-prometheus-kube-controller-manager
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 90.0.0
    chart: kube-prometheus-stack-90.0.0
    heritage: Helm
    release: kube-prometheus-stack
  name: kube-prometheus-kube-controller-manager
  namespace: monitoring
spec:
  endpoints:
    - authorization:
        credentials:
          key: token
          name: kube-prometheus-prometheus-token
        type: Bearer
      port: http-metrics
      scheme: https
      tlsConfig:
        ca:
          configMap:
            key: ca.crt
            name: kube-root-ca.crt
        insecureSkipVerify: true
  jobLabel: jobLabel
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app: kube-prometheus-kube-controller-manager
      release: kube-prometheus-stack
